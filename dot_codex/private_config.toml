#:schema https://developers.openai.com/codex/config-schema.json

analytics.enabled = false
check_for_update_on_startup = false
model = "deepseek-v4-pro"
model_catalog_json = "catalog_short.json"
model_provider = "openrouter"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
show_raw_agent_reasoning = false
skills.bundled.enabled = false

[tui]
show_tooltips = false
vim_mode_default = true
status_line = [
  "model",
  "reasoning",
  "project-name",
  "context-used",
  "task-progress"
]
status_line_use_colors = true

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
http_headers = { HTTP-Referer = "https://openai.com/codex/" }
env_http_headers = { x-session-id = "CODEX_THREAD_ID" }

[mcp_servers.cloudflare-docs]
enabled = false
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.ghidra]
enabled = false
command = "nix"
args = [
  "develop",
  "/Users/jan/Repositories/ghidra-mcp",
  "--command",
  "python",
  "/Users/jan/Repositories/ghidra-mcp/bridge_mcp_ghidra.py"
]

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "rtk hook claude"
timeout = 5
